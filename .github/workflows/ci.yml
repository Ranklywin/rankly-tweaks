name: Build and verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Interface and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:release
      - run: npm run build

  windows:
    name: Rust tests and installer
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      # Includes real PowerShell tests that only write to a disposable registry key.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        env:
          # Without these secrets (forks, pull requests), the build skips update signatures.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package.mjs
      - name: Verify package
        shell: bash
        env:
          SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then node scripts/verify-package.mjs; else node scripts/verify-package.mjs --allow-unsigned-updates; fi
      - run: npm run checksums
      - name: Write updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then node scripts/updater-manifest.mjs; else echo "::warning::No signing key; this build cannot publish an update."; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rankly-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/Rankly-Tweaks-*-setup.exe
            release/Rankly-Tweaks-*-setup.exe.sig
            release/SHA256SUMS.txt
            release/latest.json
            RELEASE_NOTES.md

  draft-release:
    name: Draft versioned release
    needs: [checks, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # A release uploaded from a local signed build is never replaced.
      - name: Check for an existing release
        id: existing
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; echo "Release $RELEASE_TAG already exists; leaving it unchanged."; fi
      - if: steps.existing.outputs.found != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rankly-windows-x64
      - name: Verify downloaded release files
        if: steps.existing.outputs.found != 'true'
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          test -s latest.json
          ls Rankly-Tweaks-*-setup.exe.sig
      # Installed apps see the update only after this draft is published.
      - name: Create draft release
        if: steps.existing.outputs.found != 'true'
        run: >-
          gh release create "$RELEASE_TAG"
          release/Rankly-Tweaks-*-setup.exe release/Rankly-Tweaks-*-setup.exe.sig
          release/SHA256SUMS.txt release/latest.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft
          --title "Rankly Tweaks $RELEASE_TAG" --notes-file RELEASE_NOTES.md
