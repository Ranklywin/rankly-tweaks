name: Build and verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - if: runner.os != 'Windows'
        run: npm run check:release
      - if: runner.os != 'Windows'
        run: npm run build
      - if: runner.os == 'Windows'
        run: npm run package
      - if: runner.os == 'Windows'
        run: npm run verify:package
      - if: runner.os == 'Windows'
        run: npm run checksums
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rankly-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/Rankly-Tweaks-*.exe
            release/SHA256SUMS.txt
            RELEASE_NOTES.md

  draft-release:
    name: Draft versioned release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rankly-windows-x64
      - name: Verify downloaded release checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/Rankly-Tweaks-*.exe release/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft
          --title "Rankly Tweaks $RELEASE_TAG" --notes-file RELEASE_NOTES.md
